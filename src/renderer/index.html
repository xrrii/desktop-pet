<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Desktop Pet</title>
  </head>
  <body data-side="left" data-assistant-open="false" data-theme="quiet">
    <section id="assistant-panel" class="assistant-shell" aria-label="AI 助手" hidden>
      <section id="conversation" class="conversation" aria-live="polite"></section>

      <section id="memory-view" class="memory-view" aria-label="记忆管理" hidden>
        <header class="memory-header">
          <h2>记忆管理</h2>
          <div class="memory-header-actions">
            <button id="memory-clear-open" class="icon-button" type="button" title="清理当前类别" aria-label="清理当前类别">⌫</button>
            <button id="memory-back" class="icon-button" type="button" title="返回聊天" aria-label="返回聊天">←</button>
          </div>
        </header>
        <nav id="memory-tabs" class="memory-tabs" aria-label="记忆类别" role="tablist">
          <button class="memory-tab is-selected" type="button" role="tab" aria-selected="true" data-memory-tab="conversations">会话历史</button>
          <button class="memory-tab" type="button" role="tab" aria-selected="false" data-memory-tab="memories">长期记忆</button>
          <button class="memory-tab" type="button" role="tab" aria-selected="false" data-memory-tab="toolLogs">使用记录</button>
        </nav>
        <div id="memory-content" class="memory-content" role="tabpanel"></div>
        <div id="memory-clear" class="memory-clear" hidden>
          <p id="memory-clear-title">确认清理？</p>
          <div class="memory-clear-actions">
            <button id="memory-clear-cancel" class="secondary-button" type="button">取消</button>
            <button id="memory-clear-confirm" class="primary-button" type="button">确认清理</button>
          </div>
        </div>
      </section>

      <section id="knowledge-view" class="knowledge-view" aria-label="知识库管理" hidden>
        <header class="memory-header">
          <h2>知识库</h2>
          <div class="memory-header-actions">
            <button id="knowledge-add" class="icon-button" type="button" title="添加目录" aria-label="添加知识库目录">+</button>
            <button id="knowledge-back" class="icon-button" type="button" title="返回聊天" aria-label="返回聊天">←</button>
          </div>
        </header>
        <section class="embedding-panel" aria-label="向量模型">
          <div class="embedding-controls">
            <select id="embedding-select" aria-label="选择向量模型"></select>
            <button id="embedding-action" class="icon-button" type="button" title="应用向量模型" aria-label="应用向量模型">✓</button>
            <button id="embedding-delete" class="icon-button" type="button" title="删除本地模型" aria-label="删除本地向量模型">⌫</button>
          </div>
          <small id="embedding-status"></small>
          <progress id="embedding-progress" max="1" value="0" aria-label="模型下载进度" hidden></progress>
          <form id="embedding-online-form" class="embedding-online-form" hidden>
            <input id="embedding-online-url" type="url" maxlength="500" placeholder="API Base URL" aria-label="在线向量 API Base URL" required />
            <input id="embedding-online-model" type="text" maxlength="200" placeholder="模型名称" aria-label="在线向量模型名称" required />
            <input id="embedding-online-dimensions" type="number" min="64" max="65536" step="1" placeholder="维度" aria-label="向量维度" required />
            <input id="embedding-online-key" type="password" maxlength="1000" placeholder="API Key" aria-label="在线向量 API Key" autocomplete="off" required />
            <div class="embedding-online-actions">
              <button id="embedding-online-cancel" class="secondary-button" type="button">取消</button>
              <button class="primary-button" type="submit">保存并使用</button>
            </div>
          </form>
        </section>
        <div id="knowledge-content" class="knowledge-content"></div>
        <div id="knowledge-delete" class="memory-clear" hidden>
          <p id="knowledge-delete-title">确认删除知识库索引？</p>
          <div class="memory-clear-actions">
            <button id="knowledge-delete-cancel" class="secondary-button" type="button">取消</button>
            <button id="knowledge-delete-confirm" class="primary-button" type="button">删除索引</button>
          </div>
        </div>
        <dialog id="embedding-confirm" class="embedding-confirm">
          <p id="embedding-confirm-title"></p>
          <div class="embedding-confirm-actions">
            <button id="embedding-confirm-cancel" class="secondary-button" type="button">取消</button>
            <button id="embedding-confirm-submit" class="primary-button" type="button">确定</button>
          </div>
        </dialog>
      </section>

      <div id="error-banner" class="error-banner" role="alert" hidden></div>

      <div
        id="command-menu"
        class="command-menu"
        role="listbox"
        aria-label="助手命令"
        hidden
      ></div>

      <form id="composer" class="composer">
        <span id="runtime-status" class="runtime-status" data-state="starting" title="正在启动">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="runtime-status-text" class="visually-hidden">正在启动</span>
        </span>
        <textarea
          id="message-input"
          rows="1"
          maxlength="12000"
          aria-label="消息"
          aria-autocomplete="list"
          aria-controls="command-menu"
          aria-expanded="false"
          placeholder="输入消息"
        ></textarea>
        <div class="composer-actions">
          <button id="new-conversation" class="icon-button" type="button" title="新对话" aria-label="新对话">+</button>
          <button id="knowledge-button" class="icon-button knowledge-button" type="button" title="知识库" aria-label="知识库" aria-pressed="false">▤</button>
          <button id="memory-button" class="icon-button memory-button" type="button" title="记忆管理" aria-label="记忆管理" aria-pressed="false">◈</button>
          <button id="send-button" class="primary-button icon-action-button" type="submit" title="发送" aria-label="发送">↑</button>
          <button id="close-button" class="icon-button" type="button" title="关闭助手" aria-label="关闭助手">×</button>
        </div>
      </form>
    </section>

    <main id="pet-root" aria-label="Desktop pet">
      <canvas id="pet-canvas" width="192" height="208"></canvas>
      <div id="pet-error" role="status" hidden></div>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
