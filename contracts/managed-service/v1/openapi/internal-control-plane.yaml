openapi: 3.1.0
info:
  title: PetDock Internal Usage Control Plane API
  version: 1.0.0
  description: FastAPI AI 数据面在容器内网调用的 Beta 配额预占与终态接口，禁止通过公网入口暴露。
x-petdock-contract-version: 1
x-petdock-network-scope: container-internal-only
servers:
  - url: http://control-plane:8080
    description: 仅表示 Docker 容器网络中的服务发现名，不是公网或宿主机地址
security:
  - serviceBearer: []
paths:
  /internal/v1/usage/reservations:
    post:
      operationId: reserveManagedChatUsage
      summary: 为一次逻辑 Chat 请求幂等预占 Beta 额度
      description: 仅 reserved 状态允许同身份、同指纹重放；已有任一终态时返回 usage_state_conflict，禁止再次调用 Provider。
      tags: [Internal Usage]
      parameters:
        - $ref: '#/components/parameters/InternalRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageReservationRequest'
      responses:
        '200':
          description: 新建或幂等重放后的预占结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReservationResponse'
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
        '503': { $ref: '#/components/responses/ErrorResponse' }
  /internal/v1/usage/reservations/{requestId}/settle:
    post:
      operationId: settleManagedChatUsage
      summary: 使用 Provider 返回的可靠实际用量结算预占
      tags: [Internal Usage]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/InternalRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageSettlementRequest'
      responses:
        '200': { $ref: '#/components/responses/TerminalResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '503': { $ref: '#/components/responses/ErrorResponse' }
  /internal/v1/usage/reservations/{requestId}/release:
    post:
      operationId: releaseManagedChatUsage
      summary: 在能够证明未调用 Provider 时释放预占
      tags: [Internal Usage]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/InternalRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageReleaseRequest'
      responses:
        '200': { $ref: '#/components/responses/TerminalResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '503': { $ref: '#/components/responses/ErrorResponse' }
  /internal/v1/usage/reservations/{requestId}/fail:
    post:
      operationId: failManagedChatUsage
      summary: Provider 已调用但实际用量未知时保守保留预占
      tags: [Internal Usage]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/InternalRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageFailureRequest'
      responses:
        '200': { $ref: '#/components/responses/TerminalResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '503': { $ref: '#/components/responses/ErrorResponse' }
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 独立服务身份凭据，只能通过 Docker Secret 或受控环境注入，禁止进入日志或契约样例。
  parameters:
    InternalRequestId:
      name: X-PetDock-Internal-Request-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ErrorResponse:
      description: 稳定内部错误响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TerminalResponse:
      description: 新建或幂等重放后的终态结果
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UsageTerminalResponse'
  schemas:
    UsageReservationRequest:
      type: object
      additionalProperties: false
      required: [version, traceId, requestId, attemptId, sessionId, userId, deviceId, capability, logicalModel, requestFingerprint, estimatedInputUnits, maxOutputUnits]
      properties:
        version: { type: integer, const: 1 }
        traceId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        capability: { type: string, const: chat }
        logicalModel: { type: string, const: chat-standard }
        requestFingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: 对完整 Chat 请求体执行 RFC 8785 规范化后计算的 SHA-256 小写十六进制摘要。
        estimatedInputUnits: { type: integer, format: int64, minimum: 0 }
        maxOutputUnits: { type: integer, format: int64, minimum: 1 }
    UsageReservationResponse:
      type: object
      additionalProperties: false
      required: [version, reservationId, requestId, status, replayed, reservedInputUnits, reservedOutputUnits]
      properties:
        version: { type: integer, const: 1 }
        reservationId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        status: { type: string, const: reserved }
        replayed: { type: boolean }
        reservedInputUnits: { type: integer, format: int64, minimum: 0 }
        reservedOutputUnits: { type: integer, format: int64, minimum: 1 }
    UsageSettlementRequest:
      type: object
      additionalProperties: false
      required: [version, attemptId, inputUnits, outputUnits]
      properties:
        version: { type: integer, const: 1 }
        attemptId: { type: string, format: uuid }
        inputUnits: { type: integer, format: int64, minimum: 0 }
        outputUnits: { type: integer, format: int64, minimum: 0 }
    UsageReleaseRequest:
      type: object
      additionalProperties: false
      required: [version, attemptId, reason]
      properties:
        version: { type: integer, const: 1 }
        attemptId: { type: string, format: uuid }
        reason: { type: string, enum: [request_rejected, provider_not_called, cancelled_before_provider] }
    UsageFailureRequest:
      type: object
      additionalProperties: false
      required: [version, attemptId, reason]
      properties:
        version: { type: integer, const: 1 }
        attemptId: { type: string, format: uuid }
        reason: { type: string, enum: [provider_usage_unknown, provider_interrupted, settlement_unavailable] }
    UsageTerminalResponse:
      type: object
      description: 只有与既有终态的 attemptId、用量或 reason 完全一致时才返回 replayed=true；任何差异返回 usage_state_conflict。
      additionalProperties: false
      required: [version, requestId, status, replayed, inputUnits, outputUnits]
      properties:
        version: { type: integer, const: 1 }
        requestId: { type: string, format: uuid }
        status: { type: string, enum: [settled, released, failed] }
        replayed: { type: boolean }
        inputUnits: { type: integer, format: int64, minimum: 0 }
        outputUnits: { type: integer, format: int64, minimum: 0 }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId, retryable, retryAfterSeconds]
          properties:
            code: { type: string, minLength: 1, maxLength: 100 }
            message: { type: string, minLength: 1, maxLength: 300 }
            requestId: { type: string, format: uuid }
            retryable: { type: boolean }
            retryAfterSeconds: { type: [integer, 'null'], minimum: 0 }
