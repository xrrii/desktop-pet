openapi: 3.1.0
info:
  title: PetDock AI Data Plane API
  version: 1.0.0
  description: 本地 Runtime 使用短期 Runtime Token 调用的官方 AI 能力接口。
x-petdock-contract-version: 1
x-petdock-phase3-public-operations:
  - POST /ai/v1/chat/completions
  - GET /ai/v1/capabilities
  - GET /ai/v1/health
servers:
  - url: https://ai.petdock.site
    description: PetDock FastAPI AI 数据面规划入口，启用前必须完成域名和证书配置
security:
  - runtimeBearer: []
paths:
  /ai/v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: 创建流式 Chat 调用
      description: Phase 3 唯一模型调用入口；逻辑模型固定为 chat-standard，Agent 与工具执行继续位于本地 Runtime。
      tags: [Chat]
      x-petdock-availability: phase-3
      x-petdock-request-body-max-bytes: 1048576
      x-petdock-tool-definition-max-bytes: 65536
      x-petdock-request-fingerprint: 对完整请求体执行 RFC 8785 JSON Canonicalization Scheme 后计算 SHA-256，小写十六进制编码。
      x-petdock-pre-stream-error-codes:
        - invalid_request
        - token_expired
        - device_revoked
        - capability_disabled
        - capability_not_entitled
        - idempotency_conflict
        - quota_exhausted
        - rate_limited
        - request_too_large
        - provider_unavailable
        - internal_error
      x-petdock-stream-error-codes:
        - authentication_expired_during_stream
        - provider_timeout
        - provider_invalid_response
        - provider_unavailable
        - request_cancelled
        - internal_error
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: 版本化 SSE 流
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Accel-Buffering:
              schema: { type: string, const: 'no' }
          content:
            text/event-stream:
              schema: { type: string }
              x-event-schema:
                $ref: '../schemas/chat-stream-event.schema.json'
              x-stream-rules:
                sequence: 从 1 开始严格递增，不允许重复或跳号。
                identity: 每个事件的 traceId 和 requestId 必须与请求 Header 一致。
                terminal: 每条流必须且只能以 completed 或 error 结束，终止后不得再发送事件。
                replay: 已发送 delta 或 tool_call 后禁止静默重放。
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '413': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
        '502': { $ref: '#/components/responses/ErrorResponse' }
        '503': { $ref: '#/components/responses/ErrorResponse' }
        '504': { $ref: '#/components/responses/ErrorResponse' }
  /ai/v1/embeddings:
    post:
      operationId: createEmbeddings
      summary: 创建批量 Embedding
      tags: [Embedding]
      x-petdock-availability: phase-4
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: Embedding 结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '413': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
        '503': { $ref: '#/components/responses/ErrorResponse' }
  /ai/v1/vision/analyze:
    post:
      operationId: analyzeImage
      summary: 分析用户明确加入会话的图片
      tags: [Vision]
      x-petdock-availability: phase-4
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisionRequest'
      responses:
        '200':
          description: 图片摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionResponse'
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '413': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
        '503': { $ref: '#/components/responses/ErrorResponse' }
  /ai/v1/rerank:
    post:
      operationId: rerankCandidates
      summary: 对本地混合召回候选进行受限重排
      tags: [Rerank]
      x-petdock-availability: phase-4
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
      responses:
        '200':
          description: 重排结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankResponse'
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '413': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
        '503': { $ref: '#/components/responses/ErrorResponse' }
  /ai/v1/web/search:
    post:
      operationId: searchWeb
      summary: 返回搜索候选，不抓取候选网页正文
      tags: [WebSearch]
      x-petdock-availability: phase-4
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSearchRequest'
      responses:
        '200':
          description: 搜索候选
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSearchResponse'
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
        '503': { $ref: '#/components/responses/ErrorResponse' }
  /ai/v1/capabilities:
    get:
      operationId: getDataPlaneCapabilities
      summary: 获取数据面实时能力状态
      tags: [System]
      x-petdock-availability: phase-3
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 实时能力状态
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, capabilities]
                properties:
                  version: { type: integer, minimum: 1 }
                  capabilities:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties: false
                      required: [available]
                      properties:
                        available: { type: boolean }
                        reason: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /ai/v1/health:
    get:
      operationId: getDataPlaneHealth
      summary: 返回不含敏感信息的就绪状态
      tags: [System]
      x-petdock-availability: phase-3
      security: []
      responses:
        '200':
          description: 数据面就绪
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, contractVersion]
                properties:
                  status: { type: string, const: ok }
                  contractVersion: { type: integer, const: 1 }
components:
  securitySchemes:
    runtimeBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TraceId:
      name: X-PetDock-Trace-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: X-PetDock-Request-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    AttemptId:
      name: X-PetDock-Attempt-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: X-PetDock-Device-Id
      in: header
      required: true
      description: 仅用于链路辅助，授权以 JWT 中签名的 device_id 为准。
      schema: { type: string, format: uuid }
    ClientVersion:
      name: X-PetDock-Client-Version
      in: header
      required: true
      schema: { type: string, pattern: '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$' }
  responses:
    ErrorResponse:
      description: 稳定错误响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    TextMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string, minLength: 1, maxLength: 200000 }
    AssistantToolCallMessage:
      type: object
      additionalProperties: false
      required: [role, content, toolCalls]
      properties:
        role: { type: string, const: assistant }
        content: { type: [string, 'null'], maxLength: 200000 }
        toolCalls:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: '#/components/schemas/ToolCall' }
    ToolResultMessage:
      type: object
      additionalProperties: false
      required: [role, toolCallId, content]
      properties:
        role: { type: string, const: tool }
        toolCallId: { type: string, minLength: 1, maxLength: 100 }
        content: { type: string, maxLength: 200000 }
    ChatMessage:
      oneOf:
        - $ref: '#/components/schemas/TextMessage'
        - $ref: '#/components/schemas/AssistantToolCallMessage'
        - $ref: '#/components/schemas/ToolResultMessage'
    ToolCall:
      type: object
      additionalProperties: false
      required: [id, name, arguments]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, pattern: '^[A-Za-z0-9_-]{1,100}$' }
        arguments: { type: object, maxProperties: 64 }
    ToolDefinition:
      type: object
      additionalProperties: false
      required: [type, function]
      properties:
        type: { type: string, const: function }
        function:
          type: object
          additionalProperties: false
          required: [name, parameters]
          properties:
            name: { type: string, pattern: '^[A-Za-z0-9_-]{1,100}$' }
            description: { type: string, maxLength: 2000 }
            parameters:
              $ref: '#/components/schemas/ToolParametersSchema'
    ToolParametersSchema:
      type: object
      additionalProperties: false
      required: [type, properties, additionalProperties]
      properties:
        type: { type: string, const: object }
        properties:
          type: object
          maxProperties: 64
          additionalProperties:
            $ref: '#/components/schemas/ToolParameterProperty'
        required:
          type: array
          maxItems: 64
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 100 }
        additionalProperties: { type: boolean, const: false }
    ToolParameterProperty:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [string, integer, number, boolean] }
        description: { type: string, maxLength: 1000 }
        enum:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: { type: [string, number, boolean] }
        minimum: { type: number }
        maximum: { type: number }
        minLength: { type: integer, minimum: 0 }
        maxLength: { type: integer, minimum: 0 }
        pattern: { type: string, maxLength: 500 }
        default: {}
    ChatRequest:
      type: object
      additionalProperties: false
      required: [logicalModel, messages, stream]
      properties:
        logicalModel: { type: string, const: chat-standard }
        messages: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/ChatMessage' } }
        stream: { type: boolean, const: true }
        tools: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/ToolDefinition' } }
    EmbeddingRequest:
      type: object
      additionalProperties: false
      required: [descriptorId, input]
      properties:
        descriptorId: { type: string, minLength: 1, maxLength: 100 }
        input: { type: array, minItems: 1, maxItems: 128, items: { type: string, maxLength: 50000 } }
    EmbeddingResponse:
      type: object
      additionalProperties: false
      required: [descriptorId, revision, dimensions, vectors, usage]
      properties:
        descriptorId: { type: string }
        revision: { type: string }
        dimensions: { type: integer, minimum: 1 }
        vectors:
          type: array
          items:
            type: array
            items: { type: number }
        usage: { $ref: '#/components/schemas/Usage' }
    VisionRequest:
      type: object
      additionalProperties: false
      required: [logicalModel, mimeType, dataBase64]
      properties:
        logicalModel: { type: string, minLength: 1, maxLength: 64 }
        mimeType: { type: string, enum: [image/png, image/jpeg, image/webp] }
        dataBase64: { type: string, minLength: 1, maxLength: 30000000 }
    VisionResponse:
      type: object
      additionalProperties: false
      required: [summary, usage]
      properties:
        summary: { type: string, maxLength: 20000 }
        usage: { $ref: '#/components/schemas/Usage' }
    RerankCandidate:
      type: object
      additionalProperties: false
      required: [id, content]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        content: { type: string, maxLength: 20000 }
    RerankRequest:
      type: object
      additionalProperties: false
      required: [logicalModel, query, candidates]
      properties:
        logicalModel: { type: string, minLength: 1, maxLength: 64 }
        query: { type: string, minLength: 1, maxLength: 10000 }
        candidates: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/RerankCandidate' } }
    RerankResponse:
      type: object
      additionalProperties: false
      required: [results, usage]
      properties:
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, score]
            properties:
              id: { type: string }
              score: { type: number }
        usage: { $ref: '#/components/schemas/Usage' }
    WebSearchRequest:
      type: object
      additionalProperties: false
      required: [query, maxResults]
      properties:
        query: { type: string, minLength: 1, maxLength: 1000 }
        maxResults: { type: integer, minimum: 1, maximum: 10 }
    WebSearchResult:
      type: object
      additionalProperties: false
      required: [title, url, excerpt, publishedAt]
      properties:
        title: { type: string, maxLength: 500 }
        url: { type: string, format: uri, maxLength: 4096 }
        excerpt: { type: string, maxLength: 5000 }
        publishedAt: { type: [string, 'null'], format: date-time }
    WebSearchResponse:
      type: object
      additionalProperties: false
      required: [results, usage]
      properties:
        results: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/WebSearchResult' } }
        usage: { $ref: '#/components/schemas/Usage' }
    Usage:
      type: object
      additionalProperties: false
      required: [inputUnits, outputUnits]
      properties:
        inputUnits: { type: integer, minimum: 0 }
        outputUnits: { type: integer, minimum: 0 }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId, retryable, retryAfterSeconds]
          properties:
            code: { type: string, minLength: 1, maxLength: 100 }
            message: { type: string, minLength: 1, maxLength: 300 }
            requestId: { type: string, format: uuid }
            retryable: { type: boolean }
            retryAfterSeconds: { type: [integer, 'null'], minimum: 0 }
